<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunside — find a terrace in the sun</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://overpass-api.de" crossorigin>
<link rel="preconnect" href="https://overpass.kumi.systems" crossorigin>
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<style>
:root{
  --ink:#202124; --sub:#5f6368; --surface:#fff; --line:#e8eaed; --chipline:#dadce0;
  --blue:#1a73e8; --bluesoft:#e8f0fe;
  --sun:#f9ab00; --sun-deep:#b06000; --sun-soft:#fef7e0;
  --partial:#fdd663; --shade:#bdc1c6; --shade-soft:#f1f3f4;
  --elev:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0;z-index:0;background:#e5e3df}
.topwrap{position:fixed;top:0;left:0;right:0;z-index:1000;padding:10px 10px 0;pointer-events:none}
.searchbar{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--surface);
  border-radius:28px;box-shadow:var(--elev);height:48px;padding:0 18px;max-width:420px;margin:0 auto}
@media(min-width:700px){.searchbar{margin:0}}
.sunicon{color:var(--sun);font-size:19px;line-height:1}
.brand{font-size:17px;font-weight:500;letter-spacing:.1px}
.sunstat{margin-left:auto;text-align:right;line-height:1.2;white-space:nowrap}
.sunstat b{display:block;font-size:14px;font-weight:500}
.sunstat span{font-size:11px;color:var(--sub)}
.chips{pointer-events:auto;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 2px 12px;
  max-width:440px;margin:0 auto;scrollbar-width:none}
@media(min-width:700px){.chips{margin:0}}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:#3c4043;
  border:0;border-radius:18px;box-shadow:var(--elev);font:inherit;font-size:14px;font-weight:500;
  height:36px;padding:0 16px;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--bluesoft);color:var(--blue)}
select.chip-btn{appearance:none;-webkit-appearance:none;padding-right:14px}
.chip-seg{flex:none;display:flex;background:var(--surface);border-radius:18px;box-shadow:var(--elev);padding:3px;height:36px}
.chip-seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;
  padding:0 14px;border-radius:15px;cursor:pointer;color:#3c4043}
.chip-seg button.on{background:var(--bluesoft);color:var(--blue)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);
  border-radius:16px 16px 0 0;box-shadow:0 -1px 6px rgba(60,64,67,.3);
  padding-bottom:env(safe-area-inset-bottom);transition:transform .2s}
.grab{display:block;width:100%;border:0;background:transparent;padding:10px 0 4px;cursor:pointer}
.grab span{display:block;width:36px;height:4px;border-radius:2px;background:var(--chipline);margin:0 auto}
.sheethead{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
.count{font-size:14px;font-weight:500;flex:1;line-height:1.35}
.count em{font-style:normal;color:var(--sun-deep)}
.nowbtn{flex:none;border:1px solid var(--chipline);background:var(--surface);border-radius:18px;
  height:34px;padding:0 16px;font:inherit;font-size:14px;font-weight:500;color:#3c4043;cursor:pointer}
.nowbtn.live{background:var(--bluesoft);border-color:transparent;color:var(--blue)}
.scrub{display:flex;align-items:center;gap:12px;padding:0 16px 10px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--shade-soft);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--sun);border:3px solid #fff;box-shadow:0 1px 3px rgba(60,64,67,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid #fff;cursor:pointer}
.tlabel{font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;min-width:44px;text-align:right;color:var(--ink)}
#list{max-height:0;overflow-y:auto;transition:max-height .25s;overscroll-behavior:contain;padding:0 8px}
.sheet.open #list{max-height:52vh;padding:4px 8px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer}
.row:active{background:var(--shade-soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:13px;color:var(--sub)}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;flex:none}
.chip.sun{background:var(--sun-soft);color:var(--sun-deep)}
.chip.partial{background:#fef7e0;color:#996a00}
.chip.shade,.chip.night{background:var(--shade-soft);color:var(--sub)}
.foot{padding:8px 16px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.45;display:none}
.sheet.open .foot{display:block}
.empty{padding:18px 14px;font-size:14px;color:var(--sub);line-height:1.5}
.fab{position:fixed;right:14px;z-index:1001;width:50px;height:50px;border-radius:50%;border:0;
  background:var(--surface);box-shadow:var(--elev);cursor:pointer;color:var(--sub);
  display:flex;align-items:center;justify-content:center}
.fab:active{color:var(--blue)}
@media(min-width:700px){
  .sheet{left:12px;right:auto;bottom:12px;width:404px;border-radius:16px}
  .grab{display:none}
  #list{max-height:46vh;padding:4px 8px 8px}
  .foot{display:block}
  .fab{bottom:24px !important;display:flex !important}
}
@media(max-width:699px){.leaflet-control-zoom{display:none}}
#overlay{position:fixed;inset:0;z-index:2000;background:rgba(255,255,255,.88);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;font-size:14px;color:var(--ink);text-align:center;padding:24px}
#overlay .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#overlay .spin{animation:none}.sheet,#list{transition:none}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;background:#202124;color:#fff;
  font-size:13px;padding:10px 18px;border-radius:8px;max-width:90vw;display:none;box-shadow:var(--elev)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--elev)}
.leaflet-popup-content{font-family:Roboto,sans-serif;font-size:14px;line-height:1.55;margin:12px 16px}
.leaflet-popup-content b{font-size:15px;font-weight:500}
.leaflet-popup-content .chip{margin-left:6px;vertical-align:1px}
.leaflet-popup-content a{color:var(--blue);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of terraces near you, colored by current sun exposure"></div>

<div class="topwrap">
  <div class="searchbar">
    <span class="sunicon" aria-hidden="true">&#9728;</span>
    <span class="brand">Sunside</span>
    <span class="sunstat"><b id="sunbig">&mdash;</b><span id="sunsub">finding the sun&hellip;</span></span>
  </div>
  <div class="chips">
    <div class="chip-seg" aria-label="Filter terraces">
      <button id="fsun" class="on">Sunny</button>
      <button id="fall">All</button>
    </div>
    <button class="chip-btn" id="searchbtn">Search this area</button>
    <select id="radius" class="chip-btn" aria-label="Search radius">
      <option value="500">500 m</option>
      <option value="800" selected>800 m</option>
      <option value="1200">1.2 km</option>
    </select>
    <button class="chip-btn" id="shadowbtn" aria-pressed="true">Shadows</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Expand or collapse the list"><span></span></button>
  <div class="sheethead">
    <span class="count" id="count">Loading&hellip;</span>
    <button class="nowbtn live" id="nowbtn">Now</button>
  </div>
  <div class="scrub">
    <input type="range" id="tslider" min="300" max="1410" step="10" value="720" aria-label="Time of day">
    <span class="tlabel" id="tlabel">--:--</span>
  </div>
  <div id="list"><div class="empty">Waiting for data&hellip;</div></div>
  <div class="foot">Venues &amp; buildings &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors via Overpass. Shadows are estimates &mdash; buildings without tagged heights are assumed ~12 m; trees, awnings and balconies aren&rsquo;t modelled. Times use this device&rsquo;s clock.</div>
</div>

<button class="fab" id="locbtn" title="Use my location" aria-label="Use my location">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    <line x1="12" y1="1.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.5"/>
    <line x1="1.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.5" y2="12"/>
  </svg>
</button>

<div id="overlay"><div class="spin"></div><div id="ovtext">Finding your location&hellip;</div></div>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ---------- sun position (compact SunCalc-style) ---------- */
const RAD=Math.PI/180, ECL=RAD*23.4397;
function toDays(d){return d.valueOf()/864e5-0.5+2440588-2451545}
function sunPos(date,lat,lng){
  const lw=RAD*-lng, phi=RAD*lat, d=toDays(date),
  M=RAD*(357.5291+0.98560028*d),
  C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)),
  Lsun=M+C+RAD*102.9372+Math.PI,
  dec=Math.asin(Math.sin(ECL)*Math.sin(Lsun)),
  ra=Math.atan2(Math.sin(Lsun)*Math.cos(ECL),Math.cos(Lsun)),
  H=RAD*(280.16+360.9856235*d)-lw-ra;
  return{
    alt:Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H))/RAD,
    az:(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))/RAD+180+360)%360
  };
}
/* ---------- state ---------- */
const PARIS={lat:48.8566,lng:2.3522};
let center={...PARIS};
let venues=[], blds=[], kx=1, ky=110540;
let curMin=nowMin(), live=true, showShadows=true, rise=null, set=null;
const DEF_H=12, LVL_H=3.0, EYE=1.0;
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function clampMin(m){return Math.max(300,Math.min(1410,Math.round(m/10)*10))}
function dateAt(mins){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),0,mins)}
function fmt(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
/* ---------- map ---------- */
const map=L.map("map",{zoomControl:false}).setView([center.lat,center.lng],16);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{
  maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>'
}).addTo(map);
const canvas=L.canvas({padding:.3});
const markerLayer=L.layerGroup().addTo(map);
const ShadeLayer=L.Layer.extend({
  onAdd(m){this._m=m;const c=this._c=document.createElement("canvas");
    c.style.position="absolute";c.style.pointerEvents="none";
    m.getPanes().overlayPane.appendChild(c);
    m.on("moveend zoomend resize",this.redraw,this);
    m.on("zoomanim",this._hide,this);
    this.redraw();return this},
  onRemove(m){m.off("moveend zoomend resize",this.redraw,this);m.off("zoomanim",this._hide,this);this._c.remove()},
  _hide(){this._c.style.display="none"},
  redraw(){
    const m=this._m,c=this._c,sz=m.getSize(),pad=Math.round(Math.max(sz.x,sz.y)*0.25);
    c.style.display="";
    c.width=sz.x+pad*2;c.height=sz.y+pad*2;
    L.DomUtil.setPosition(c,m.containerPointToLayerPoint([-pad,-pad]));
    const ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
    if(!showShadows||!blds.length)return;
    const sun=sunPos(dateAt(curMin),center.lat,center.lng);
    if(sun.alt<=0.8)return;
    const azr=sun.az*RAD,tanAlt=Math.tan(sun.alt*RAD);
    const sx=-Math.sin(azr),sy=-Math.cos(azr);
    const b0=m.getBounds().pad(0.4),
          sw=toXY(b0.getSouth(),b0.getWest()),ne=toXY(b0.getNorth(),b0.getEast());
    const mpp=156543.03392*Math.cos(center.lat*RAD)/Math.pow(2,m.getZoom());
    const minSize=2.5*mpp;
    ctx.beginPath();
    let n=0;
    for(const b of blds){
      if(b.bbox[2]<sw.x||b.bbox[0]>ne.x||b.bbox[3]<sw.y||b.bbox[1]>ne.y)continue;
      if((b.bbox[2]-b.bbox[0])+(b.bbox[3]-b.bbox[1])<minSize)continue;
      if(++n>6000)break;
      const len=Math.min(b.h/tanAlt,450),vx=sx*len,vy=sy*len;
      const pts=b.pts,np=pts.length;
      // footprint ring, forced counter-clockwise so all subpaths share winding
      for(let i=0;i<np;i++){
        const cp=m.latLngToContainerPoint(toLL(pts[b.ccw?i:np-1-i]));
        if(i)ctx.lineTo(cp.x+pad,cp.y+pad);else ctx.moveTo(cp.x+pad,cp.y+pad);
      }
      ctx.closePath();
      // exact swept shadow: one parallelogram per wall, winding-corrected
      for(let i=0;i<np;i++){
        const A=pts[i],B=pts[(i+1)%np];
        const cr=(B.x-A.x)*vy-(B.y-A.y)*vx;
        if(Math.abs(cr)<1e-6)continue;
        const Av={x:A.x+vx,y:A.y+vy},Bv={x:B.x+vx,y:B.y+vy};
        const quad=cr>0?[A,B,Bv,Av]:[A,Av,Bv,B];
        for(let j=0;j<4;j++){
          const cp=m.latLngToContainerPoint(toLL(quad[j]));
          if(j)ctx.lineTo(cp.x+pad,cp.y+pad);else ctx.moveTo(cp.x+pad,cp.y+pad);
        }
        ctx.closePath();
      }
    }
    ctx.fillStyle="rgba(47,58,74,0.20)";
    ctx.fill();
  }
});
const shade=new ShadeLayer().addTo(map);
/* ---------- geometry helpers (local metres around centre) ---------- */
function setProj(){kx=111320*Math.cos(center.lat*RAD); ky=110540}
function toXY(lat,lng){return{x:(lng-center.lng)*kx, y:(lat-center.lat)*ky}}
function toLL(p){return[center.lat+p.y/ky, center.lng+p.x/kx]}
function pip(p,pts){let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i],b=pts[j];
    if((a.y>p.y)!==(b.y>p.y) && p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) inside=!inside;
  } return inside}
function raySeg(P,d,A,C){
  const ex=C.x-A.x, ey=C.y-A.y, det=ex*d.y-d.x*ey;
  if(Math.abs(det)<1e-9)return null;
  const wx=A.x-P.x, wy=A.y-P.y;
  const t=(ex*wy-wx*ey)/det, u=(d.x*wy-wx*d.y)/det;
  return (u>=0&&u<=1&&t>0)?t:null;
}
function rayBox(P,d,bb,maxd){
  let t0=0,t1=maxd;
  for(let ax=0;ax<2;ax++){
    const o=ax?P.y:P.x, dd=ax?d.y:d.x, mn=bb[ax], mx=bb[ax+2];
    if(Math.abs(dd)<1e-9){ if(o<mn||o>mx)return false; }
    else{ let a=(mn-o)/dd,b=(mx-o)/dd; if(a>b){const s=a;a=b;b=s}
      t0=Math.max(t0,a); t1=Math.min(t1,b); if(t0>t1)return false; }
  } return true;
}
function hull(pts){
  const p=pts.slice().sort((a,b)=>a.x-b.x||a.y-b.y);
  if(p.length<3)return p;
  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[],up=[];
  for(const q of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
  for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
  lo.pop();up.pop();return lo.concat(up);
}
/* ---------- shadow physics (grid-indexed) ---------- */
let maxH=30, bldsReady=false;
let grid=new Map(); const CELL=60, GINV=1/CELL;
function buildGrid(){
  grid=new Map();
  for(let i=0;i<blds.length;i++){
    const bb=blds[i].bbox,
    x0=Math.floor(bb[0]*GINV),x1=Math.floor(bb[2]*GINV),
    y0=Math.floor(bb[1]*GINV),y1=Math.floor(bb[3]*GINV);
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
      const k=x+","+y;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(i);
    }
  }
}
function blockedAt(P,d,tanAlt,maxd){
  const seen=new Set(), step=CELL*0.3;
  for(let t=0;t<=maxd+CELL;t+=step){
    const arr=grid.get(Math.floor((P.x+d.x*t)*GINV)+","+Math.floor((P.y+d.y*t)*GINV));
    if(!arr)continue;
    for(const i of arr){
      if(seen.has(i))continue;seen.add(i);
      const b=blds[i];
      if(!rayBox(P,d,b.bbox,maxd))continue;
      const n=b.pts.length;
      for(let j=0;j<n;j++){
        const tt=raySeg(P,d,b.pts[j],b.pts[(j+1)%n]);
        if(tt!==null && tt>0.6 && tt<maxd && b.h > tt*tanAlt+EYE) return true;
      }
    }
  } return false;
}
function adjustPoint(p){
  const arr=grid.get(Math.floor(p.x*GINV)+","+Math.floor(p.y*GINV));
  if(!arr)return p;
  for(const i of arr){
    const b=blds[i];
    if(p.x<b.bbox[0]||p.x>b.bbox[2]||p.y<b.bbox[1]||p.y>b.bbox[3])continue;
    if(!pip(p,b.pts))continue;
    let best=null,bd=1e18;
    const n=b.pts.length;
    for(let i2=0;i2<n;i2++){
      const A=b.pts[i2],C=b.pts[(i2+1)%n],ex=C.x-A.x,ey=C.y-A.y;
      const L2=ex*ex+ey*ey||1e-9;
      let u=((p.x-A.x)*ex+(p.y-A.y)*ey)/L2; u=Math.max(0,Math.min(1,u));
      const q={x:A.x+u*ex,y:A.y+u*ey}, d2=(q.x-p.x)**2+(q.y-p.y)**2;
      if(d2<bd){bd=d2;best=q}
    }
    let cx=0,cy=0;for(const q of b.pts){cx+=q.x;cy+=q.y}cx/=n;cy/=n;
    let ox=best.x-cx,oy=best.y-cy;const m=Math.hypot(ox,oy)||1;
    return{x:best.x+ox/m*4,y:best.y+oy/m*4};
  } return p;
}
function statusFor(v,sun){
  if(sun.alt<=0)return"night";
  if(!bldsReady)return"pending";
  const azr=sun.az*RAD, d={x:Math.sin(azr),y:Math.cos(azr)};
  const tanAlt=Math.tan(sun.alt*RAD);
  const maxd=Math.min(500,maxH/tanAlt+10);
  const per={x:-d.y,y:d.x}, P=v.adj;
  const pts=[P,{x:P.x+3.5*per.x,y:P.y+3.5*per.y},{x:P.x-3.5*per.x,y:P.y-3.5*per.y}];
  let nb=0;for(const p of pts)if(blockedAt(p,d,tanAlt,maxd))nb++;
  return nb===0?"sun":nb===3?"shade":"partial";
}
/* ---------- rendering ---------- */
const COL={sun:"#f9ab00",partial:"#fdd663",shade:"#bdc1c6",night:"#bdc1c6",pending:"#bdc1c6"};
const TXT={sun:"In the sun",partial:"Partial sun",shade:"In shade",night:"Sun is down",pending:"Checking\u2026"};
const KIND={bar:"Bar",pub:"Pub",cafe:"Café",restaurant:"Restaurant",biergarten:"Beer garden",ice_cream:"Ice cream",terrace:"Terrace"};
function computeRiseSet(){
  rise=set=null;
  for(let m=0;m<1436;m+=4){
    const a=sunPos(dateAt(m),center.lat,center.lng).alt,
          b=sunPos(dateAt(m+4),center.lat,center.lng).alt;
    if(a<=0&&b>0)rise=m+4; if(a>0&&b<=0)set=m+4;
  }
  const sl=document.getElementById("tslider");
  if(rise!==null&&set!==null){
    const lo=+sl.min,hi=+sl.max,p1=(rise-lo)/(hi-lo)*100,p2=(set-lo)/(hi-lo)*100;
    sl.style.background=`linear-gradient(90deg,#f1f3f4 ${p1}%,#fde293 ${p1}%,#fde293 ${p2}%,#f1f3f4 ${p2}%)`;
  }
}
function refresh(){
  const t=dateAt(curMin), sun=sunPos(t,center.lat,center.lng);
  document.getElementById("tlabel").textContent=fmt(curMin);
  document.getElementById("tslider").value=curMin;
  const dirs=["N","NE","E","SE","S","SW","W","NW"];
  document.getElementById("sunbig").textContent=sun.alt>0?Math.round(sun.alt)+"° "+dirs[Math.round(sun.az/45)%8]:"Sun is down";
  document.getElementById("sunsub").textContent=(rise!==null?"↑ "+fmt(rise):"")+(set!==null?"  ↓ "+fmt(set):"")+(live?"  ·  live":"  ·  "+fmt(curMin));
  markerLayer.clearLayers();
  let sunny=0,partial=0;
  for(const v of venues){v.st=statusFor(v,sun);if(v.st==="sun")sunny++;else if(v.st==="partial")partial++}
  const drawOrder={shade:0,night:0,pending:0,partial:1,sun:2};
  for(const v of venues.slice().sort((a,b)=>drawOrder[a.st]-drawOrder[b.st])){
    const sty=v.st==="sun"
      ?{radius:9,weight:2,color:"#ffffff",fillColor:COL.sun,fillOpacity:1}
      :v.st==="partial"
      ?{radius:6,weight:1,color:"rgba(35,33,28,.3)",fillColor:COL.partial,fillOpacity:.95}
      :v.st==="pending"
      ?{radius:5,stroke:false,fillColor:"#9aa0a6",fillOpacity:.6}
      :{radius:3.5,stroke:false,fillColor:"#9aa0a6",fillOpacity:.45};
    const gm="https://www.google.com/maps/dir/?api=1&destination="+v.lat+","+v.lng;
    const pos=bldsReady?toLL(v.adj):[v.lat,v.lng];
    const m=L.circleMarker(pos,Object.assign({renderer:canvas},sty));
    m.bindPopup(`<b>${esc(v.name)}</b><span class="chip ${v.st}">${TXT[v.st]}</span><br>`+
      `${KIND[v.kind]||v.kind} · ${Math.round(v.dist)} m away<br>`+
      `<a href="${gm}" target="_blank" rel="noopener">Directions ↗</a>`);
    m.addTo(markerLayer); v.marker=m;
  }
  const order={sun:0,partial:1,pending:2,shade:3,night:4};
  let sorted=venues.slice().sort((a,b)=>order[a.st]-order[b.st]||a.dist-b.dist);
  if(filt==="sunny")sorted=sorted.filter(v=>v.st==="sun"||v.st==="partial"||v.st==="pending");
  const list=document.getElementById("list");
  list.innerHTML="";
  if(!sorted.length){
    list.innerHTML=venues.length
      ?'<div class="empty">Nothing is in the sun at this time. Tap <b>All</b> to see every terrace, or scrub the slider to earlier in the day.</div>'
      :'<div class="empty">No terraces tagged with outdoor seating here — OSM coverage varies by city. Try a bigger radius or another spot.</div>';
  }
  for(const v of sorted){
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<span class="dot" style="background:${COL[v.st]}"></span>`+
      `<span class="nm"><b>${esc(v.name)}</b><span>${KIND[v.kind]||v.kind} · ${Math.round(v.dist)} m</span></span>`+
      `<span class="chip ${v.st}">${TXT[v.st]}</span>`;
    r.onclick=()=>{map.panTo([v.lat,v.lng]);v.marker&&v.marker.openPopup()};
    list.appendChild(r);
  }
  const lowtxt=sun.alt>0&&sun.alt<8?" · golden hour, shadows are long":"";
  document.getElementById("count").innerHTML=!bldsReady&&sun.alt>0?
    `${venues.length} terraces · calculating shadows…`:
    sun.alt>0?
    `<em>${sunny} in the sun</em> · ${partial} partial · ${venues.length} total${lowtxt}`:
    `${venues.length} terraces nearby · sun is down`;
  shade.redraw();
  if(typeof positionFab==="function")requestAnimationFrame(positionFab);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* ---------- data ---------- */
const ENDPOINTS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
try{const fav=localStorage.getItem("ss:ep"),ix=ENDPOINTS.indexOf(fav);
  if(ix>0){ENDPOINTS.splice(ix,1);ENDPOINTS.unshift(fav)}}catch(e){}
async function opQuery(q){
  let err=null;
  for(const ep of ENDPOINTS){
    try{
      const res=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
      if(!res.ok)throw new Error("HTTP "+res.status);
      const j=await res.json();
      try{localStorage.setItem("ss:ep",ep)}catch(e){}
      return j;
    }catch(e){err=e}
  }
  throw err||new Error("unreachable");
}
function cacheKey(r){return center.lat.toFixed(4)+","+center.lng.toFixed(4)+","+r}
function cacheGet(k,ttl){
  try{const raw=localStorage.getItem("ss:"+k);if(!raw)return null;
    const o=JSON.parse(raw);return(Date.now()-o.t>ttl)?null:o.d}catch(e){return null}
}
function cacheSet(k,d){
  const s=JSON.stringify({t:Date.now(),d});
  try{localStorage.setItem("ss:"+k,s)}catch(e){
    try{for(const key of Object.keys(localStorage))if(key.startsWith("ss:")&&key!=="ss:ep")localStorage.removeItem(key);
      localStorage.setItem("ss:"+k,s)}catch(e2){}}
}
function parseVenues(data){
  venues=[];const seen=new Set();
  for(const el of data.elements){
    if(!el.tags||!(el.tags.amenity||el.tags.leisure==="outdoor_seating"))continue;
    const lat=el.lat??(el.center&&el.center.lat),lng=el.lon??(el.center&&el.center.lon);
    if(lat==null)continue;
    const key=el.type+el.id;if(seen.has(key))continue;seen.add(key);
    addVenue(el.tags.name||null,el.tags.amenity||"terrace",lat,lng);
  }
}
function addVenue(name,kind,lat,lng){
  const p=toXY(lat,lng);
  venues.push({name:name||(KIND[kind]||"Terrace")+" (unnamed)",kind,lat,lng,
    dist:Math.hypot(p.x,p.y),raw:p,adj:p});
}
function venuesCompact(){return venues.map(v=>[v.name,v.kind,+v.lat.toFixed(6),+v.lng.toFixed(6)])}
function venuesFromCompact(a){venues=[];for(const[name,kind,lat,lng]of a)addVenue(name,kind,lat,lng)}
function addBld(ll,h){
  if(ll.length<3)return;
  const pts=ll.map(g=>toXY(g[0],g[1]));
  let minx=1e18,miny=1e18,maxx=-1e18,maxy=-1e18,ar=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[(i+1)%pts.length];
    if(p.x<minx)minx=p.x;if(p.x>maxx)maxx=p.x;if(p.y<miny)miny=p.y;if(p.y>maxy)maxy=p.y;
    ar+=p.x*q.y-q.x*p.y;
  }
  if(h>maxH)maxH=h;
  blds.push({pts,h,bbox:[minx,miny,maxx,maxy],ccw:ar>=0});
}
function parseBlds(data){
  blds=[];maxH=20;const compact=[];
  for(const el of data.elements){
    if(!(el.tags&&el.tags.building&&el.geometry))continue;
    let h=parseFloat(el.tags.height);
    if(!isFinite(h)||h<=0){const lv=parseFloat(el.tags["building:levels"]);h=isFinite(lv)&&lv>0?lv*3.0+1.5:12}
    h=Math.min(h,250);
    const flat=[];for(const g of el.geometry){flat.push(+g.lat.toFixed(6),+g.lon.toFixed(6))}
    if(flat.length<6)continue;
    compact.push([Math.round(h*10)/10,flat]);
    const ll=[];for(let i=0;i<flat.length;i+=2)ll.push([flat[i],flat[i+1]]);
    addBld(ll,h);
  }
  return compact;
}
function bldsFromCompact(arr){
  blds=[];maxH=20;
  for(const[h,flat]of arr){
    const ll=[];for(let i=0;i<flat.length;i+=2)ll.push([flat[i],flat[i+1]]);
    addBld(ll,h);
  }
}
function finishBlds(){buildGrid();bldsReady=true;for(const v of venues)v.adj=adjustPoint(v.raw);refresh()}
let fetchSeq=0;
async function fetchData(){
  const seq=++fetchSeq;
  const r=+document.getElementById("radius").value;
  setProj();
  bldsReady=false;blds=[];grid=new Map();
  const ck=cacheKey(r);
  const cv=cacheGet("v:"+ck,864e5), cb=cacheGet("b:"+ck,7*864e5);
  const vq=`[out:json][timeout:25];
(
  nwr(around:${r},${center.lat},${center.lng})["amenity"~"^(bar|pub|cafe|restaurant|biergarten|ice_cream)$"]["outdoor_seating"]["outdoor_seating"!~"^no$"];
  nwr(around:${r},${center.lat},${center.lng})["amenity"="biergarten"];
  nwr(around:${r},${center.lat},${center.lng})["leisure"="outdoor_seating"];
);
out center tags;`;
  const bq=`[out:json][timeout:40];
way(around:${r+300},${center.lat},${center.lng})["building"];
out geom 6000;`;
  let pv=null,pb=null;
  if(!cb)pb=opQuery(bq);
  if(cv){venuesFromCompact(cv)}else{overlay(true,"Finding terraces\u2026");pv=opQuery(vq)}
  if(pv){
    try{
      const d=await pv;if(seq!==fetchSeq)return;
      parseVenues(d);cacheSet("v:"+ck,venuesCompact());
    }catch(e){
      if(seq!==fetchSeq)return;overlay(false);
      toast("Couldn\u2019t reach Overpass ("+(e&&e.message)+"). Try again in a minute \u2014 it rate-limits.");
      return;
    }
  }
  overlay(false);
  computeRiseSet();
  if(cb){bldsFromCompact(cb);finishBlds()}else refresh();
  if(!venues.length)toast("No outdoor-seating venues found here in OSM. Try a bigger radius.");
  if(pb){
    try{
      const d=await pb;if(seq!==fetchSeq)return;
      cacheSet("b:"+ck,parseBlds(d));finishBlds();
    }catch(e){
      if(seq!==fetchSeq)return;
      toast("Couldn\u2019t load building data \u2014 sun status unavailable. Try \u201cSearch this area\u201d again.");
    }
  }
}
/* ---------- ui plumbing ---------- */
function overlay(on,txt){const o=document.getElementById("overlay");o.style.display=on?"flex":"none";if(txt)document.getElementById("ovtext").textContent=txt}
let toastTimer=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",6000)}
let deb=null;
document.getElementById("tslider").addEventListener("input",e=>{
  curMin=+e.target.value;live=false;document.getElementById("nowbtn").classList.remove("live");
  document.getElementById("tlabel").textContent=fmt(curMin);
  clearTimeout(deb);deb=setTimeout(refresh,120);
});
document.getElementById("nowbtn").onclick=()=>{live=true;curMin=clampMin(nowMin());document.getElementById("nowbtn").classList.add("live");refresh()};
setInterval(()=>{if(live){const m=clampMin(nowMin());if(m!==curMin){curMin=m;refresh()}}},60000);
document.getElementById("shadowbtn").onclick=function(){showShadows=!showShadows;this.setAttribute("aria-pressed",showShadows);shade.redraw()};
let filt="sunny";
document.getElementById("fsun").onclick=()=>{filt="sunny";setSeg();refresh()};
document.getElementById("fall").onclick=()=>{filt="all";setSeg();refresh()};
function setSeg(){document.getElementById("fsun").classList.toggle("on",filt==="sunny");document.getElementById("fall").classList.toggle("on",filt==="all")}
document.getElementById("searchbtn").onclick=()=>{const c=map.getCenter();center={lat:c.lat,lng:c.lng};fetchData()};
document.getElementById("radius").onchange=()=>fetchData();
document.getElementById("locbtn").onclick=()=>locate(true);
function locate(manual){
  if(!navigator.geolocation){fallback("Geolocation isn’t available in this browser");return}
  overlay(true,"Finding your location…");
  navigator.geolocation.getCurrentPosition(pos=>{
    center={lat:pos.coords.latitude,lng:pos.coords.longitude};
    map.setView([center.lat,center.lng],16);
    fetchData();
  },e=>{ if(manual){overlay(false);toast("Location was blocked — pan the map and tap “Search this area” instead.")} else fallback("Couldn’t get your location"); },
  {enableHighAccuracy:false,timeout:7000,maximumAge:120000});
}
function fallback(why){
  toast(why+" — showing Paris. Pan anywhere and tap “Search this area”.");
  center={...PARIS};map.setView([center.lat,center.lng],16);fetchData();
}
/* ---------- bottom sheet & fab ---------- */
const sheetEl=document.getElementById("sheet"),fabEl=document.getElementById("locbtn");
let sheetOpen=false;
function setSheet(o){sheetOpen=o;sheetEl.classList.toggle("open",o);requestAnimationFrame(positionFab);setTimeout(positionFab,260)}
function positionFab(){
  if(window.innerWidth>=700)return;
  if(sheetOpen){fabEl.style.display="none";return}
  fabEl.style.display="flex";
  fabEl.style.bottom=(sheetEl.getBoundingClientRect().height+14)+"px";
}
document.getElementById("grab").onclick=()=>setSheet(!sheetOpen);
let swipeY=null;
sheetEl.addEventListener("touchstart",e=>{
  if(sheetOpen&&e.target.closest("#list"))return;
  swipeY=e.touches[0].clientY;
},{passive:true});
sheetEl.addEventListener("touchend",e=>{
  if(swipeY===null)return;
  const dy=e.changedTouches[0].clientY-swipeY;swipeY=null;
  if(dy<-30)setSheet(true);else if(dy>30)setSheet(false);
},{passive:true});
window.addEventListener("resize",positionFab);
/* ---------- boot ---------- */
curMin=clampMin(nowMin());
positionFab();
locate(false);
</script>
